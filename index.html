<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chip Bowl Blitz 🥔</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0c1d;
      --surface:  #1a1730;
      --accent:   #f5a623;
      --accent2:  #e84393;
      --green:    #39ff14;
      --text:     #f0eaff;
      --muted:    #7b6fa0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* ── Stars background ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(245,166,35,.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(232,67,147,.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 18px 24px 8px;
      width: 100%;
    }

    header h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
      text-shadow: none;
      filter: drop-shadow(0 0 18px rgba(245,166,35,.5));
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 14px rgba(245,166,35,.4)); }
      50%       { filter: drop-shadow(0 0 28px rgba(232,67,147,.6)); }
    }

    header p {
      color: var(--muted);
      font-size: .8rem;
      margin-top: 2px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── HUD row ── */
    .hud {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 20px;
      align-items: center;
      padding: 6px 20px;
      margin-bottom: 6px;
    }

    .hud-card {
      background: var(--surface);
      border: 1px solid rgba(245,166,35,.2);
      border-radius: 14px;
      padding: 8px 20px;
      text-align: center;
      min-width: 90px;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }

    .hud-card .label {
      font-size: .6rem;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .hud-card .value {
      font-family: 'Fredoka One', cursive;
      font-size: 1.8rem;
      line-height: 1;
    }

    #score-val  { color: var(--accent); }
    #chips-val  { color: var(--accent2); }
    #streak-val { color: var(--green); }

    /* ── Canvas wrapper ── */
    .canvas-wrap {
      position: relative;
      z-index: 5;
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid rgba(245,166,35,.15);
      box-shadow:
        0 0 0 1px rgba(245,166,35,.08),
        0 20px 60px rgba(0,0,0,.6),
        inset 0 0 80px rgba(15,12,29,.8);
    }

    #gameCanvas {
      display: block;
      cursor: crosshair;
      background: transparent;
    }

    /* ── Overlay messages ── */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 22px;
      backdrop-filter: blur(6px);
      background: rgba(15,12,29,.75);
      z-index: 20;
      transition: opacity .4s ease;
    }

    .overlay h2 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2rem, 6vw, 3.5rem);
      text-align: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .overlay p {
      color: var(--muted);
      font-size: .9rem;
      text-align: center;
      max-width: 260px;
    }

    .btn {
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      padding: 12px 36px;
      border-radius: 50px;
      letter-spacing: 1px;
      box-shadow: 0 6px 24px rgba(245,166,35,.4);
      transition: transform .15s, box-shadow .15s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(245,166,35,.55);
    }

    .btn:active { transform: translateY(0); }

    /* ── back link ── */
    .back-link {
      position: fixed;
      top: 14px;
      left: 18px;
      z-index: 100;
      color: var(--muted);
      font-size: .75rem;
      text-decoration: none;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,.08);
      padding: 6px 14px;
      border-radius: 50px;
      transition: color .2s, border-color .2s;
    }

    .back-link:hover { color: var(--text); border-color: rgba(245,166,35,.4); }

    /* ── Instructions ── */
    .instructions {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 24px;
      margin-top: 8px;
      color: var(--muted);
      font-size: .72rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .instructions span { display: flex; align-items: center; gap: 6px; }
    .instructions em   { color: var(--text); font-style: normal; }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← Back</a>

  <header>
    <h1>🥔 Chip Bowl Blitz</h1>
    <p>Flick chips into the bowl · Score big</p>
  </header>

  <div class="hud">
    <div class="hud-card"><div class="label">Score</div><div class="value" id="score-val">0</div></div>
    <div class="hud-card"><div class="label">Chips</div><div class="value" id="chips-val">10</div></div>
    <div class="hud-card"><div class="label">Streak</div><div class="value" id="streak-val">0</div></div>
  </div>

  <div class="canvas-wrap" id="wrap">
    <canvas id="gameCanvas"></canvas>
    <!-- Start overlay -->
    <div class="overlay" id="start-overlay">
      <h2>Chip Bowl Blitz</h2>
      <p>Click &amp; drag on a chip to aim, release to launch it into the bowl!</p>
      <button class="btn" id="start-btn">Let's Snack! 🥔</button>
    </div>
    <!-- Game-over overlay (hidden) -->
    <div class="overlay" id="gameover-overlay" style="display:none;">
      <h2 id="go-title">Game Over!</h2>
      <p id="go-score">You scored <strong>0</strong> pts with <strong>0</strong> goals!</p>
      <button class="btn" id="restart-btn">Play Again 🔄</button>
    </div>
  </div>

  <div class="instructions">
    <span>🎯 <em>Drag</em> to aim</span>
    <span>🚀 <em>Release</em> to launch</span>
    <span>🥗 <em>Land in the bowl</em></span>
  </div>

  <script>
  (() => {
    // ── Canvas setup ──────────────────────────────────────────────────────────
    const canvas  = document.getElementById('gameCanvas');
    const ctx     = canvas.getContext('2d');
    const wrap    = document.getElementById('wrap');

    function resize() {
      const vw = Math.min(window.innerWidth - 32, 780);
      const vh = Math.min(window.innerHeight - 220, 520);
      canvas.width  = vw;
      canvas.height = vh;
    }
    resize();
    window.addEventListener('resize', () => { resize(); resetPositions(); });

    // ── State ─────────────────────────────────────────────────────────────────
    const TOTAL_CHIPS   = 10;
    const GRAVITY       = 0.38;
    const FRICTION      = 0.98;
    const BOUNCE        = 0.35;

    let score = 0, chipsLeft = TOTAL_CHIPS, streak = 0, goals = 0;
    let gameActive = false;
    let animId;

    // Chip state
    const chipRadius = 22;
    let chip = {};
    // Drag state
    let dragging = false, dragStart = {x:0,y:0}, dragCurrent = {x:0,y:0};
    // Flying chip
    let flying = false, vx = 0, vy = 0, cx = 0, cy = 0;
    let chipAngle = 0, chipSpin = 0;
    // Particles
    let particles = [];
    // Floating texts
    let floatingTexts = [];

    // Bowl
    let bowl = {};

    function resetPositions() {
      chip = {
        x: canvas.width * 0.14,
        y: canvas.height * 0.72,
      };
      bowl = {
        x: canvas.width * 0.78,
        y: canvas.height * 0.68,
        rx: 52, // half-width of bowl opening
        ry: 18, // bowl ellipse y-radius
        depth: 40,
      };
    }
    resetPositions();

    // ── HUD update ────────────────────────────────────────────────────────────
    function updateHUD() {
      document.getElementById('score-val').textContent  = score;
      document.getElementById('chips-val').textContent  = chipsLeft;
      document.getElementById('streak-val').textContent = streak;
    }
    updateHUD();

    // ── Drawing helpers ───────────────────────────────────────────────────────

    // Realistic chip (ridged wafer shape)
    function drawChip(x, y, angle, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.rotate(angle);

      // Shadow
      ctx.shadowColor  = 'rgba(0,0,0,.5)';
      ctx.shadowBlur   = 8;
      ctx.shadowOffsetX = 3;
      ctx.shadowOffsetY = 3;

      // Main chip body – golden wafer ellipse
      const grd = ctx.createRadialGradient(-6,-6,2, 0,0, chipRadius);
      grd.addColorStop(0,   '#ffe08a');
      grd.addColorStop(0.4, '#f5a623');
      grd.addColorStop(0.75,'#d4841a');
      grd.addColorStop(1,   '#a85a00');
      ctx.beginPath();
      ctx.ellipse(0, 0, chipRadius, chipRadius * 0.6, 0, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();

      // Ridges (curved lines across chip)
      ctx.shadowColor = 'transparent';
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = 'rgba(0,0,0,.18)';
      for (let i = -3; i <= 3; i++) {
        const xOff = i * 6;
        ctx.beginPath();
        ctx.moveTo(xOff, -chipRadius * 0.55);
        ctx.bezierCurveTo(xOff + 3, 0, xOff + 3, 0, xOff, chipRadius * 0.55);
        ctx.stroke();
      }

      // Salt specks
      ctx.shadowColor = 'transparent';
      const specks = [[4,-4],[-6,2],[8,6],[-3,-8],[1,9],[-9,-2],[7,-9]];
      for (const [sx, sy] of specks) {
        ctx.beginPath();
        ctx.arc(sx, sy, 1.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.fill();
      }

      ctx.restore();
    }

    // Snack bowl
    function drawBowl() {
      const {x, y, rx, ry, depth} = bowl;
      ctx.save();

      // Bowl outer shadow
      ctx.shadowColor  = 'rgba(0,0,0,.5)';
      ctx.shadowBlur   = 16;
      ctx.shadowOffsetY = 6;

      // Bowl body (trapezoid→ ellipse combo)
      ctx.beginPath();
      ctx.moveTo(x - rx, y);
      ctx.bezierCurveTo(x - rx - 8, y + depth * 0.5, x - rx * 0.3, y + depth * 1.1, x, y + depth);
      ctx.bezierCurveTo(x + rx * 0.3, y + depth * 1.1, x + rx + 8, y + depth * 0.5, x + rx, y);
      ctx.closePath();
      const bodyGrd = ctx.createLinearGradient(x - rx, y, x + rx, y + depth);
      bodyGrd.addColorStop(0,   '#2c2060');
      bodyGrd.addColorStop(0.5, '#3d2e8c');
      bodyGrd.addColorStop(1,   '#1a1445');
      ctx.fillStyle = bodyGrd;
      ctx.fill();

      ctx.shadowColor = 'transparent';

      // Bowl rim (top ellipse)
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      const rimGrd = ctx.createLinearGradient(x - rx, y - ry, x + rx, y + ry);
      rimGrd.addColorStop(0,   '#7c6fff');
      rimGrd.addColorStop(0.5, '#5045c0');
      rimGrd.addColorStop(1,   '#3a30a0');
      ctx.fillStyle = rimGrd;
      ctx.fill();
      ctx.strokeStyle = 'rgba(180,170,255,.5)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Rim highlight
      ctx.beginPath();
      ctx.ellipse(x, y - 3, rx * 0.65, ry * 0.5, 0, 0, Math.PI);
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Chips already in bowl (decorative)
      for (let i = 0; i < Math.min(goals, 5); i++) {
        const bx = x + (i - 2) * 14;
        const by = y + 8 + i * 3;
        ctx.save();
        ctx.rotate(i * 0.4);
        ctx.beginPath();
        ctx.ellipse(bx, by, 12, 7, i * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(38, 90%, ${55 + i * 4}%, 0.85)`;
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    }

    // Aim arrow
    function drawAimArrow() {
      if (!dragging) return;
      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 10) return;

      const power = Math.min(dist / 120, 1);
      const endX  = chip.x + dx * 2.2;
      const endY  = chip.y + dy * 2.2;

      // Dashed trajectory preview (parabolic dots)
      const simVx = dx * 0.14;
      const simVy = dy * 0.14;
      ctx.save();
      for (let t = 0; t < 18; t++) {
        const tt = t * 3;
        const px = chip.x + simVx * tt;
        const py = chip.y + simVy * tt + 0.5 * GRAVITY * tt * tt;
        const a  = 1 - t / 18;
        ctx.globalAlpha = a * 0.65;
        ctx.beginPath();
        ctx.arc(px, py, 3 - t * 0.1, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(38, 90%, ${70 + t * 1.5}%)`;
        ctx.fill();
      }
      ctx.restore();

      // Power bar (arc around chip)
      ctx.save();
      ctx.globalAlpha = .85;
      ctx.strokeStyle = `hsl(${120 - power * 120}, 90%, 55%)`;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(chip.x, chip.y, chipRadius + 8, -Math.PI / 2, -Math.PI / 2 + power * Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Ground line
    function drawGround() {
      const gy = canvas.height * 0.88;
      const grad = ctx.createLinearGradient(0, gy, 0, canvas.height);
      grad.addColorStop(0,   'rgba(245,166,35,.18)');
      grad.addColorStop(0.4, 'rgba(245,166,35,.04)');
      grad.addColorStop(1,   'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(0, gy, canvas.width, canvas.height - gy);

      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(canvas.width, gy);
      ctx.strokeStyle = 'rgba(245,166,35,.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Particles
    function spawnParticles(x, y, type = 'goal') {
      const colors = type === 'goal'
        ? ['#f5a623','#ffe08a','#39ff14','#e84393','#fff']
        : ['#a0a0a0','#888','#ccc'];
      for (let i = 0; i < (type === 'goal' ? 40 : 12); i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd   = Math.random() * (type === 'goal' ? 7 : 3) + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd - (type === 'goal' ? 3 : 1),
          radius: Math.random() * (type === 'goal' ? 5 : 3) + 1.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1,
          decay: Math.random() * 0.025 + 0.015,
          gravity: 0.18,
          isChip: type === 'goal' && Math.random() > 0.7,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.2,
        });
      }
    }

    function updateParticles() {
      particles = particles.filter(p => p.life > 0);
      for (const p of particles) {
        p.x  += p.vx;
        p.y  += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.97;
        p.life -= p.decay;
        p.angle += p.spin;
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        if (p.isChip) {
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.beginPath();
          ctx.ellipse(0, 0, p.radius * 2, p.radius * 1.2, 0, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        }
        ctx.restore();
      }
    }

    // Floating score texts
    function spawnText(x, y, text, color = '#f5a623') {
      floatingTexts.push({ x, y, text, color, life: 1, vy: -1.5 });
    }

    function updateFloatingTexts() {
      floatingTexts = floatingTexts.filter(t => t.life > 0);
      for (const t of floatingTexts) {
        t.y  += t.vy;
        t.life -= 0.018;
      }
    }

    function drawFloatingTexts() {
      for (const t of floatingTexts) {
        ctx.save();
        ctx.globalAlpha = t.life;
        ctx.fillStyle   = t.color;
        ctx.font        = `bold ${Math.round(28 * t.life + 12)}px 'Fredoka One', cursive`;
        ctx.textAlign   = 'center';
        ctx.shadowColor = 'rgba(0,0,0,.5)';
        ctx.shadowBlur  = 6;
        ctx.fillText(t.text, t.x, t.y);
        ctx.restore();
      }
    }

    // ── Collision / scoring ───────────────────────────────────────────────────
    function checkBowl() {
      // Hit if chip center is within the elliptical rim of the bowl
      const dx = (cx - bowl.x) / bowl.rx;
      const dy = (cy - bowl.y) / bowl.ry;
      return dx * dx + dy * dy <= 1;
    }

    function checkGround() {
      return cy + chipRadius >= canvas.height * 0.88;
    }

    function landChip(isGoal) {
      flying = false;
      if (isGoal) {
        goals++;
        streak++;
        const bonusMult = streak >= 3 ? 2 : 1;
        const pts = (100 + (streak - 1) * 25) * bonusMult;
        score += pts;
        spawnParticles(cx, cy, 'goal');
        const msgs = ['PERFECT! 🎯','SWISH! 🍟','CRISPY! 🥔','SALTY WIN! 🧂','ON FIRE! 🔥'];
        spawnText(cx, cy - 30, streak >= 3 ? `×${bonusMult} ${msgs[Math.min(streak-1,4)]}` : msgs[0], '#39ff14');
        if (streak >= 3) spawnText(cx, cy - 60, `STREAK ×${streak}!`, '#e84393');
      } else {
        streak = 0;
        spawnParticles(cx, cy, 'miss');
        spawnText(cx, cy - 20, 'MISSED! 😭', 'var(--accent2)');
      }

      chipsLeft--;
      updateHUD();

      if (chipsLeft <= 0) {
        setTimeout(showGameOver, 1400);
      } else {
        // Reset chip position after short delay
        setTimeout(resetChip, 900);
      }
    }

    function resetChip() {
      chip = { x: canvas.width * 0.14, y: canvas.height * 0.72 };
      flying = false;
      dragging = false;
      chipAngle = 0;
      chipSpin  = 0;
    }

    // ── Game Over ─────────────────────────────────────────────────────────────
    function showGameOver() {
      gameActive = false;
      cancelAnimationFrame(animId);
      const ov = document.getElementById('gameover-overlay');
      const title = document.getElementById('go-title');
      const scoreEl = document.getElementById('go-score');
      title.textContent = goals >= 7 ? '🏆 Chip Champion!' : goals >= 4 ? '😎 Nice Snacking!' : '😅 Keep Practicing!';
      scoreEl.innerHTML = `You scored <strong>${score}</strong> pts with <strong>${goals}</strong> goals out of ${TOTAL_CHIPS} chips!`;
      ov.style.display = 'flex';
      // Draw final frame
      draw();
    }

    // ── Game loop ─────────────────────────────────────────────────────────────
    function update() {
      if (!flying) return;

      cx += vx;
      cy += vy;
      vy += GRAVITY;
      vx *= FRICTION;
      chipAngle += chipSpin;

      // Wall bounce
      if (cx - chipRadius < 0) {
        cx = chipRadius; vx = Math.abs(vx) * BOUNCE;
        chipSpin *= -0.5;
      }
      if (cx + chipRadius > canvas.width) {
        cx = canvas.width - chipRadius; vx = -Math.abs(vx) * BOUNCE;
        chipSpin *= -0.5;
      }

      // Bowl check (when falling downward and chip is near bowl height)
      if (vy > 0 && cy + chipRadius >= bowl.y - bowl.ry * 0.5 && cy - chipRadius < bowl.y + bowl.depth) {
        if (checkBowl()) {
          landChip(true);
          return;
        }
      }

      // Ground check
      if (checkGround()) {
        cy = canvas.height * 0.88 - chipRadius;
        vy = -vy * BOUNCE;
        vx *= 0.6;
        chipSpin *= 0.5;
        if (Math.abs(vy) < 1.2) {
          landChip(false);
        }
      }

      // Off screen (right side past bowl – count as miss)
      if (cx > canvas.width + 60 || cy > canvas.height + 60) {
        landChip(false);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sky gradient
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0,   '#0f0c1d');
      sky.addColorStop(0.7, '#1a1730');
      sky.addColorStop(1,   '#150f2a');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Soft glow behind bowl
      const glow = ctx.createRadialGradient(bowl.x, bowl.y, 0, bowl.x, bowl.y, 110);
      glow.addColorStop(0,   'rgba(112,90,255,.12)');
      glow.addColorStop(1,   'transparent');
      ctx.fillStyle = glow;
      ctx.fillRect(bowl.x - 120, bowl.y - 120, 240, 240);

      drawGround();
      drawBowl();
      drawAimArrow();

      if (!flying) drawChip(chip.x, chip.y, chipAngle);
      else         drawChip(cx, cy, chipAngle);

      updateParticles();
      drawParticles();
      updateFloatingTexts();
      drawFloatingTexts();

      if (gameActive) {
        update();
        animId = requestAnimationFrame(draw);
      }
    }

    // ── Input – mouse ─────────────────────────────────────────────────────────
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }

    function isOnChip(pos) {
      return Math.hypot(pos.x - chip.x, pos.y - chip.y) <= chipRadius + 12;
    }

    canvas.addEventListener('mousedown', e => {
      if (!gameActive || flying) return;
      const pos = getPos(e);
      if (!isOnChip(pos)) return;
      dragging = true;
      dragStart   = { ...pos };
      dragCurrent = { ...pos };
    });

    canvas.addEventListener('mousemove', e => {
      if (!dragging) return;
      dragCurrent = getPos(e);
    });

    canvas.addEventListener('mouseup', e => {
      if (!dragging) return;
      dragging = false;
      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 8) return;
      flying = true;
      cx = chip.x; cy = chip.y;
      const power = Math.min(dist / 100, 1.4);
      vx = dx * 0.14 * power;
      vy = dy * 0.14 * power;
      chipSpin = (dx > 0 ? 1 : -1) * Math.min(Math.abs(dx) / 80, 0.25);
    });

    // Touch support
    canvas.addEventListener('touchstart', e => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY })); }, { passive: false });
    canvas.addEventListener('touchmove',  e => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY })); }, { passive: false });
    canvas.addEventListener('touchend',   e => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mouseup')); }, { passive: false });

    // ── Start / Restart ───────────────────────────────────────────────────────
    function startGame() {
      score = 0; chipsLeft = TOTAL_CHIPS; streak = 0; goals = 0;
      particles = []; floatingTexts = [];
      resetPositions();
      resetChip();
      updateHUD();
      gameActive = true;
      draw();
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('start-overlay').style.opacity = '0';
      setTimeout(() => { document.getElementById('start-overlay').style.display = 'none'; startGame(); }, 400);
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      document.getElementById('gameover-overlay').style.display = 'none';
      startGame();
    });

    // Initial draw (idle)
    draw();
  })();
  </script>
</body>
</html>
